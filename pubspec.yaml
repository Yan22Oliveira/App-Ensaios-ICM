name: class_attendance
description: "An attendance management app designed for rehearsals and worship groups, with participant registration and reporting features."

publish_to: 'none'

version: 1.0.1+4

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  uuid: ^4.4.0
  collection: ^1.18.0
  file_picker: ^8.0.3
  csv: ^6.0.0
  # Mantido compatível com flutter_localizations (SDK).
  intl: ^0.20.2
  share_plus: ^12.0.0
  path_provider: ^2.1.4
  pdf: ^3.10.7
  printing: ^5.12.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.0
  brasil_fields: ^1.19.0

  #Libs Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1

  # Futuro offline:
  # hive: ^2.2.3
  # hive_flutter: ^1.1.0
  # path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true